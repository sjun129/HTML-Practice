<!DOCTYPE html>
<html lang="ko">
<head>
    <title> 나의 자기소개 페이지 </title>
    <style>
        h1{
            font-size: 40px;
        }

        p{
            font-size: 20px;
        }

        .card{
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            background-color: #ffffff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            width: 500px;
        }

        button{
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            background-color: #ffffff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            width: 200px;
        }
        button:hover {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        .navbar {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 20px;
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }

        .navbar li {
            display: inline;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-weight: bold;

        }

        .navbar a:hover {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <nav>
        <ul class="navbar">
            <li> l </li>
            <li><a href="index.html">홈</a></li>
            <li> l </li>
            <li><a href="about.html">소개</a></li>
            <li> l </li>
            <li><a href="contact.html">연락처</a></li>
            <li> l </li>
        </ul>
    </nav>
    <h1>서상준</h1>
    <p>자기소개 페이지입니다.</p>
    <div class="card">
        <button onclick="location.href='about.html'"> 소개페이지로 이동</button>
        <button onclick="location.href='contact.html'">연락하기</button>
    </div>
</body>
</html>
